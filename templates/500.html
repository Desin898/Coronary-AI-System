{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-danger">
        <i class="bi bi-bug"></i> 500
    </div>
    <h1 class="display-4 mb-4">Internal Server Error</h1>
    <p class="lead mb-4">
        Something went wrong on our end. We're working to fix the issue.
        Please try again later.
    </p>
    <div class="mt-5">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg me-3">
            <i class="bi bi-house-door"></i> Go to Homepage
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-arrow-left"></i> Go Back
        </a>
    </div>
</div>
{% endblock %}
