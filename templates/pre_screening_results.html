<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardioAI · Screening Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(145deg, #e9eff9 0%, #d8e3f0 100%);
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
    }
    .main-container { max-width: 820px; margin: 0 auto; }

    .card {
      border-radius: 32px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(12px);
      border: none;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .risk-badge {
      font-size: 1.1rem;
      padding: 0.45rem 1.4rem;
      border-radius: 40px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .prob-bar-bg {
      background: rgba(0,0,0,0.08);
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
      margin: 6px 0 4px;
    }
    .prob-bar-fill { height: 100%; border-radius: 99px; transition: width 0.9s ease; }
    .prob-label    { display: flex; justify-content: space-between; font-size: 0.78rem; color: #777; }

    .factor-item {
      background: rgba(255,255,255,0.55);
      border-radius: 18px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.65rem;
    }

    .section-title {
      font-weight: 600;
      color: #13293e;
      border-left: 4px solid #2a5298;
      padding-left: 14px;
      margin: 1.4rem 0 1rem;
    }

    /* ── Navigation buttons ── */
    .btn-outline-navy {
      border-radius: 40px;
      border: 2px solid #2a5298;
      color: #2a5298;
      background: transparent;
      font-weight: 600;
      padding: 10px 22px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      transition: background 0.18s, color 0.18s;
    }
    .btn-outline-navy:hover { background: #2a5298; color: #fff; }

    .btn-navy {
      border-radius: 40px;
      background: linear-gradient(105deg, #1f3a6b, #2d4f89);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 22px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      transition: background 0.18s;
    }
    .btn-navy:hover { background: linear-gradient(105deg, #163157, #1f3f6b); color: #fff; }

    /* Recommendations button */
    .btn-rec {
      border-radius: 40px;
      background: linear-gradient(105deg, #1a6b4a, #26a06d);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 22px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      transition: background 0.18s;
    }
    .btn-rec:hover { background: linear-gradient(105deg, #145438, #1d8357); color: #fff; }

    /* 10-year risk card */
    .tenyear-card {
      border-radius: 22px;
      border: 1.5px solid rgba(42,82,152,0.2);
      background: linear-gradient(135deg, #f0f5ff 0%, #e8f0fb 100%);
      padding: 1.5rem 1.6rem;
    }

    .fill-low    { stroke: #198754; }
    .fill-medium { stroke: #fd7e14; }
    .fill-high   { stroke: #dc3545; }
    .text-low    { color: #198754; }
    .text-medium { color: #fd7e14; }
    .text-high   { color: #dc3545; }

    .gauge-wrap { position: relative; width: 150px; height: 82px; margin: 0 auto 6px; }
    .gauge-wrap svg { width: 100%; height: 100%; overflow: visible; }

    .alert-high {
      border-radius: 18px;
      background: #fff5f5;
      border: 1.5px solid #f5c6cb;
      border-left: 5px solid #dc3545;
      padding: 1.1rem 1.3rem;
      margin-top: 1rem;
    }
    .alert-high h6 { color: #b52b27; font-weight: 700; margin-bottom: 4px; }
    .alert-high p  { color: #7d2020; font-size: 0.9rem; margin: 0; }

    .alert-unavailable {
      border-radius: 14px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      padding: 1rem 1.2rem;
      color: #6c757d;
      font-size: 0.88rem;
    }

    .disclaimer {
      font-size: 0.78rem;
      color: #6c757d;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    #actionButtons { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
  </style>
</head>
<body>
<div class="main-container">

  <!-- CURRENT RISK CARD -->
  <div class="card">
    <div class="d-flex align-items-center mb-3">
      <i class="fas fa-heartbeat fs-2 me-3" style="color:#2a5298;"></i>
      <div>
        <h4 class="mb-0">Current Cardiovascular Risk</h4>
        <small class="text-muted">Based on your health data today</small>
      </div>
    </div>
    <div id="currentRiskContent">
      <div class="text-center text-muted py-3">
        <i class="fas fa-spinner fa-pulse me-2"></i>Loading…
      </div>
    </div>
  </div>

  <!-- 10-YEAR RISK CARD — shown when current risk is LOW -->
  <div class="card" id="tenYearCard" style="display:none;">
    <div class="d-flex align-items-center mb-3">
      <i class="fas fa-calendar-alt fs-2 me-3" style="color:#2a5298;"></i>
      <div>
        <h4 class="mb-0">10-Year Coronary Heart Disease Risk</h4>
        <small class="text-muted">Machine-learning model trained on Framingham Heart Study data</small>
      </div>
    </div>
    <div id="tenYearContent">
      <div class="text-center text-muted py-3">
        <i class="fas fa-spinner fa-pulse me-2"></i>Computing…
      </div>
    </div>
  </div>

  <!-- ACTION BUTTONS -->
  <div class="text-center mt-1 mb-4" id="actionButtons"></div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   Build semicircle gauge
   ══════════════════════════════════════════════════════════════════ */
function buildGauge(pct, colourClass) {
  const R    = 60;
  const full = Math.PI * R;
  const fill = Math.min(pct / 100, 1) * full;
  return `
    <div class="gauge-wrap">
      <svg viewBox="0 0 140 72">
        <path d="M10,70 A60,60 0 0,1 130,70"
              fill="none" stroke="#dde6f5" stroke-width="13" stroke-linecap="round"/>
        <path d="M10,70 A60,60 0 0,1 130,70"
              fill="none" stroke-width="13" stroke-linecap="round"
              class="${colourClass}"
              stroke-dasharray="${fill.toFixed(2)} ${full.toFixed(2)}"/>
        <text x="70" y="66" text-anchor="middle"
              font-size="17" font-weight="700" fill="#13293e">${pct}%</text>
      </svg>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   contributing factors list
   ══════════════════════════════════════════════════════════════════ */
function renderFactors(explanation) {
  if (!explanation || explanation.length === 0) return '<p>No explanation factors available.</p>';
  let h = '<div class="section-title">Key Contributing Factors</div>';
  explanation.forEach((f, i) => {
    const emoji = f.effect === 'higher risk' ? '🔴' : '🟢';
    h += `
      <div class="factor-item">
        <div class="d-flex justify-content-between align-items-center">
          <span><strong>${i+1}. ${emoji} ${f.factor}</strong> (value: ${f.value})</span>
          <span class="badge bg-light text-dark">impact: ${f.impact > 0 ? '+' : ''}${f.impact}</span>
        </div>
        <small class="text-muted">${f.effect}</small>
      </div>`;
  });
  return h;
}

/* ══════════════════════════════════════════════════════════════════
   10-year risk panel
   ══════════════════════════════════════════════════════════════════ */
function renderTenYear(fy) {
  const gauge = buildGauge(fy.percent, `fill-${fy.colour}`);
  document.getElementById('tenYearContent').innerHTML = `
    <div class="tenyear-card">
      <div class="row align-items-center gy-3">
        <div class="col-sm-4 text-center">
          ${gauge}
          <div class="text-${fy.colour} fw-bold fs-5">${fy.category} RISK</div>
          <div class="text-muted" style="font-size:0.79rem;">10-year CHD probability</div>
        </div>
        <div class="col-sm-8">
          <h6 class="fw-bold mb-3" style="color:#1f3a6b;">10-Year CHD Model Results</h6>
          <table class="table table-sm table-borderless mb-2" style="font-size:0.9rem;">
            <tbody>
              <tr>
                <td class="text-muted ps-0" style="width:55%;">10-Year CHD Risk</td>
                <td><strong class="text-${fy.colour}">${fy.percent}%</strong></td>
              </tr>
              <tr>
                <td class="text-muted ps-0">Risk Category</td>
                <td><strong>${fy.category}</strong></td>
              </tr>
            </tbody>
          </table>
          <p class="mb-0" style="font-size:0.88rem;">${fy.advice}</p>
        </div>
      </div>
      <div class="disclaimer">
        <strong>Note:</strong> This 10-year coronary heart disease risk estimate is produced by
        a machine-learning model trained on the Framingham Heart Study dataset. It is a validated
        screening aid, not a clinical diagnosis. Consult a healthcare professional for personalised guidance.
      </div>
    </div>`;
  document.getElementById('tenYearCard').style.display = 'block';
}

/* ══════════════════════════════════════════════════════════════════
   Fetch 10-year risk from backend
   ══════════════════════════════════════════════════════════════════ */
async function fetchTenYearRisk(patientData) {
  try {
    const resp = await fetch('/predict_ten_year', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(patientData)
    });
    const json = await resp.json();
    if (json.success) {
      renderTenYear(json);
    } else {
      document.getElementById('tenYearContent').innerHTML = `
        <div class="alert-unavailable">
          <i class="fas fa-info-circle me-2"></i>
          10-year risk model is currently unavailable: ${json.message}
        </div>`;
      document.getElementById('tenYearCard').style.display = 'block';
    }
  } catch (err) {
    document.getElementById('tenYearContent').innerHTML = `
      <div class="alert-unavailable">
        <i class="fas fa-info-circle me-2"></i>
        Could not connect to the 10-year risk model.
      </div>`;
    document.getElementById('tenYearCard').style.display = 'block';
  }
}

/* ══════════════════════════════════════════════════════════════════
   MAIN
   ══════════════════════════════════════════════════════════════════ */
function displayResult() {
  const raw = localStorage.getItem('screeningResult');
  if (!raw) { window.location.href = '/'; return; }

  const result  = JSON.parse(raw);
  const isHigh  = result.risk_status === 'HIGH_RISK';
  const prob    = (result.risk_probability * 100).toFixed(1);
  const badgeCls  = isHigh ? 'bg-danger'  : 'bg-success';
  const barColour = isHigh ? 'bg-danger'  : 'bg-success';

  /* CURRENT RISK CONTENT */
  let html = `
    <div class="text-center mb-3">
      <span class="risk-badge ${badgeCls} text-white">
        ${result.risk_status.replace(/_/g, ' ')}
      </span>
    </div>
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-baseline">
        <span class="fw-semibold">Risk Probability</span>
        <strong>${prob}%</strong>
      </div>
      <div class="prob-bar-bg">
        <div class="prob-bar-fill ${barColour}" style="width:${prob}%"></div>
      </div>
      <div class="prob-label"><span>0%</span><span>100%</span></div>
    </div>
    <p class="mb-2">${result.message}</p>
    ${renderFactors(result.explanation)}
    <p class="mt-2 mb-0"><strong>Next step:</strong> ${result.next_step.replace(/_/g, ' ')}</p>
  `;

  if (isHigh) {
    html += `
      <div class="alert-high">
        <h6> High Current Risk Detected</h6>
        <p>Your cardiovascular risk is currently elevated. ECG testing is strongly recommended.
           A 10-year risk projection is not shown when current risk is high please proceed
           with clinical evaluation first.</p>
      </div>`;
  }

  document.getElementById('currentRiskContent').innerHTML = html;

  /* 10-YEAR RISK — only when current risk is LOW */
  if (!isHigh) {
    const pd = result.patient_data
             || JSON.parse(localStorage.getItem('screeningFormData') || 'null');
    if (pd) {
      fetchTenYearRisk(pd);
    } else {
      document.getElementById('tenYearContent').innerHTML = `
        <div class="alert-unavailable">
          <i class="fas fa-info-circle me-2"></i>
          Patient data unavailable — please re-run the screening.
        </div>`;
      document.getElementById('tenYearCard').style.display = 'block';
    }
  }

  /* ── ACTION BUTTONS ─────────────────────────────────────────── */
  // Recommendations button is hidden when current risk is LOW_RISK.
  const ecgLabel = result.requires_ecg ? 'Upload ECG (Mandatory)' : 'Upload ECG (Optional)';

  let buttonsHtml = `
    <a href="/" class="btn-outline-navy">
      <i class="fas fa-redo"></i> New Screening
    </a>`;

  // Only show recommendations button when risk is HIGH (not LOW_RISK)
  if (isHigh) {
    buttonsHtml += `
    <a href="/recommendations?source=screening" class="btn-rec">
      <i class="fas fa-clipboard-list"></i> View Recommendations
    </a>`;
  }

  buttonsHtml += `
    <a href="/upload_ecg.html" class="btn-navy">
      <i class="fas fa-upload"></i> ${ecgLabel}
    </a>`;

  document.getElementById('actionButtons').innerHTML = buttonsHtml;
}

displayResult();
</script>
</body>
</html>
