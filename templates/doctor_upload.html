<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioAI · Doctor ECG Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #e9eff9 0%, #d8e3f0 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 30px 50px rgba(0,20,40,0.15), 0 0 0 1px rgba(255,255,255,0.6) inset;
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .header-box {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header-box i {
            font-size: 3rem;
            color: #1e3c72;
            background: rgba(255,255,255,0.5);
            padding: 1rem;
            border-radius: 50%;
        }
        h2 {
            color: #13293e;
            font-weight: 600;
        }
        .upload-area {
            border: 2px dashed rgba(42,82,152,0.4);
            border-radius: 28px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: 0.2s;
            margin: 2rem 0;
        }
        .upload-area:hover {
            background: rgba(255,255,255,0.8);
            border-color: #2a5298;
        }
        .upload-area i {
            font-size: 3rem;
            color: #2a5298;
            margin-bottom: 1rem;
        }
        .form-control, .form-select {
            border-radius: 18px !important;
            padding: 0.75rem 1.2rem !important;
            border: 1px solid rgba(0,30,60,0.12) !important;
            background: rgba(255,255,255,0.7) !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2a5298 !important;
            box-shadow: 0 6px 16px rgba(42,82,152,0.2) !important;
        }
        label {
            font-weight: 500;
            color: #1e3b5c;
            margin-left: 6px;
        }
        .btn-upload {
            background: linear-gradient(105deg, #1f3a6b, #2d4f89);
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            color: white;
            box-shadow: 0 15px 25px -8px #0f2b4b;
            transition: 0.2s;
        }
        .btn-upload:hover {
            background: linear-gradient(105deg, #17315b, #234373);
            transform: scale(1.02);
        }
        .btn-back {
            background: rgba(30,60,90,0.5);
            backdrop-filter: blur(6px);
            border: none;
            border-radius: 40px;
            padding: 14px 24px;
            font-weight: 600;
            color: white;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover {
            background: rgba(20,45,70,0.8);
            color: white;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 2rem;
        }
        #file-name {
            margin-top: 1rem;
            font-weight: 500;
            color: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="upload-card">
        <div class="header-box">
            <i class="fas fa-heartbeat"></i>
            <h2 class="mt-3">Direct ECG Upload for Analysis</h2>
            <p class="text-muted">Upload patient ECG reports for AI analysis and blockage detection.</p>
        </div>

        <!-- Form now submits to Flask backend -->
        <form method="POST" action="{{ url_for('upload_ecg') }}" enctype="multipart/form-data">
            <!-- Patient Info -->
            <div class="mb-4">
                <h5 class="section-title"><i class="fas fa-user-injured me-2"></i>Patient Information</h5>
                <input type="text" class="form-control mb-3" name="patient_id" placeholder="Patient ID or Name" required>
                <input type="number" class="form-control mb-3" name="age" placeholder="Age" min="1" max="120" required>
                <select class="form-select mb-3" name="gender" required>
                    <option value="" selected disabled>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <textarea class="form-control" name="notes" placeholder="Clinical notes (optional)" rows="3"></textarea>
            </div>

            <!-- Upload area (click triggers file input) -->
            <div class="upload-area" onclick="document.getElementById('ecg-file').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <h4>📁 Upload ECG File</h4>
                <p>Click to select or drag & drop ECG file</p>
                <p class="small text-secondary">Supported formats: PDF, JPG, PNG, DICOM</p>
                <input type="file" id="ecg-file" name="ecg_file" accept=".pdf,.jpg,.jpeg,.png,.dicom" style="display: none;" required>
                <div id="file-name" class="fw-semibold"></div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <a href="doctor_login.html" class="btn-back flex-fill text-center"><i class="bi bi-arrow-left me-2"></i>Back</a>
                <button type="submit" class="btn-upload flex-fill">Upload & Analyze with AI <i class="bi bi-arrow-right ms-2"></i></button>
            </div>
        </form>

        <footer class="text-center mt-4 text-secondary small">
            <i class="far fa-clock me-1"></i> AI powered Heart Health
        </footer>
    </div>

    <script>
        // Check doctor verification (client-side simulation)
        if (!localStorage.getItem('doctorVerified')) {
            window.location.href = 'doctor_login.html';
        }

        // Display selected file name
        const fileInput = document.getElementById('ecg-file');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = `Selected: ${e.target.files[0].name}`;
            } else {
                fileNameDisplay.textContent = '';
            }
        });
    </script>
</body>
</html>
