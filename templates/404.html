{% extends "base.html" %}

{% block title %}Page Not Found - Coronary AI Detection System{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-muted">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="display-4 mb-4">404 - Page Not Found</h1>
    <p class="lead mb-4">The page you are looking for doesn't exist or has been moved.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house-door me-2"></i> Go to Homepage
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-arrow-left me-2"></i> Go Back
        </a>
    </div>
</div>
{% endblock %}
